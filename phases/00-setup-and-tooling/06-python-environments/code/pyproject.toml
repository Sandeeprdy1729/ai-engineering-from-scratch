[project]
name = "llm-finetuning-project"
version = "0.1.0"
description = "Fine-tune a small LLM with PyTorch and call the Anthropic API for evaluation"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.1",
    "anthropic>=0.39",
    "numpy>=1.26",
    "datasets>=2.14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
train = ["torchvision>=0.16", "accelerate>=0.28"]
